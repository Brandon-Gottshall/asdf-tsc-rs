name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, to catch upstream release changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x -S warning bin/* lib/*.bash lib/commands/* scripts/*.sh test/run.sh
      - run: node --check proxy/tsc-proxy.cjs

  plugin-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: asdf-vm/actions/plugin-test@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          command: tsc-rs --version

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bash: [default]
        include:
          # macOS's own /bin/bash is 3.2; make sure the plugin still runs under it.
          - os: macos-latest
            bash: system
    name: e2e (${{ matrix.os }}, bash ${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g pnpm@9 bun@1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - if: runner.os == 'macOS'
        run: brew install fish
      - if: matrix.bash == 'system'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
      - run: bash --version | head -n 1
      - run: test/run.sh "$RUNNER_TEMP/tsc-rs-e2e"
